[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dockit-ai"
version = "0.1.0"
description = "Conversational dock-exception management for SetuHaul freight operations."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "python-dotenv",
    "boto3>=1.35",
    "fastapi[standard]>=0.115",
    "langchain>=1.0",
    "langchain-aws>=0.2",
    "ortools>=9.15",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "PyJWT[crypto]>=2.10",
    "redis>=5.2",   
]

[project.scripts]
dockit-api = "dockit.api.main:run"

[project.optional-dependencies]
ui = ["streamlit>=1.42"]
dev = [
    "httpx>=0.28",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dockit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
packages = ["dockit"]
